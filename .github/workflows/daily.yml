name: Daily Info Collection

on:
  schedule:
    - cron: '0 */2 * * *'  # 2時間おき（UTC 0, 2, 4...時）に実行
  workflow_dispatch:      # 手動実行を許可する設定（これが必要です）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-generativeai feedparser beautifulsoup4 requests PyGithub

      - name: Run collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Daily data update" || exit 0
          git push
